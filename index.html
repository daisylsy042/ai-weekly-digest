<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Weekly Digest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #ffffff;
    --text: #1a1a1a;
    --text-secondary: #5c5c5c;
    --text-muted: #8a8a8a;
    --border: rgba(26, 26, 26, 0.1);
    --border-strong: rgba(26, 26, 26, 0.18);
    --rail-width: 64px;
    --panel-width: 320px;
    --shadow-panel: 4px 0 32px rgba(26, 26, 26, 0.1);
    --shadow-card: 0 16px 48px rgba(26, 26, 26, 0.1);
    --transition: 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
    /* Relais 风格几何无衬线（DM Sans ≈ Avenir / Gill Sans） */
    --font: "DM Sans", "Helvetica Neue", "Arial", "PingFang SC", "Hiragino Sans GB",
      "Microsoft YaHei", sans-serif;
    --hero-title-size: clamp(40px, 6vw, 56px);
    --card-title-size: 20px;
    --card-body-size: 14px;
    --card-cta-size: 11px;
    --card-meta-size: 11px;
    --card-height: 520px;
    --card-media-height: 200px;
    --card-body-min: 280px;
  }

  @media (max-width: 767px) {
    :root {
      --card-height: 500px;
      --card-media-height: 180px;
      --card-body-min: 260px;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 400;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    line-height: 1.5;
  }

  /* —— Icon Rail —— */
  .icon-rail {
    position: fixed;
    top: 0;
    left: 0;
    width: var(--rail-width);
    height: 100vh;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 20px;
    gap: 4px;
    z-index: 200;
  }

  .rail-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--text-secondary);
    border-radius: 2px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .rail-btn:hover {
    background: rgba(26, 26, 26, 0.05);
    color: var(--text);
  }

  .rail-btn.is-active {
    background: rgba(26, 26, 26, 0.08);
    color: var(--text);
  }

  .rail-btn svg {
    width: 20px;
    height: 20px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  /* —— Slide Panels —— */
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(26, 26, 26, 0.35);
    opacity: 0;
    visibility: hidden;
    transition: opacity 0.3s ease, visibility 0.3s ease;
    z-index: 150;
  }

  #overlay.is-visible {
    opacity: 1;
    visibility: visible;
  }

  .slide-panel {
    position: fixed;
    top: 0;
    left: var(--rail-width);
    width: var(--panel-width);
    height: 100vh;
    background: var(--surface);
    box-shadow: var(--shadow-panel);
    transform: translateX(-100%);
    transition: transform var(--transition);
    z-index: 180;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .slide-panel.is-open {
    transform: translateX(0);
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 24px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .panel-header h2 {
    margin: 0;
    font-family: var(--font);
    font-size: 1.25rem;
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  .panel-close {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--text-muted);
    transition: color 0.2s, background 0.2s;
    border-radius: 2px;
  }

  .panel-close:hover {
    color: var(--text);
    background: rgba(26, 26, 26, 0.05);
  }

  .panel-close svg {
    width: 18px;
    height: 18px;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.75;
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .panel-body::-webkit-scrollbar { width: 4px; }
  .panel-body::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 2px;
  }

  .search-field {
    width: 100%;
    padding: 12px 0;
    border: none;
    border-bottom: 1px solid var(--border-strong);
    background: transparent;
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }

  .search-field::placeholder { color: var(--text-muted); }
  .search-field:focus { border-bottom-color: var(--text); }

  .filter-section__label {
    display: block;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 12px;
  }

  .chip-group {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    max-height: 140px;
    overflow-y: auto;
  }

  .chip-group::-webkit-scrollbar { width: 3px; height: 3px; }
  .chip-group::-webkit-scrollbar-thumb {
    background: var(--border-strong);
    border-radius: 2px;
  }

  .chip {
    appearance: none;
    border: 1px solid var(--border-strong);
    background: transparent;
    cursor: pointer;
    padding: 5px 10px;
    font-size: 11px;
    font-weight: 400;
    color: var(--text-secondary);
    transition: all 0.2s ease;
    white-space: nowrap;
    font-family: inherit;
  }

  .chip:hover {
    border-color: var(--text);
    color: var(--text);
  }

  .chip.active {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }

  .chip.disabled {
    opacity: 0.3;
    pointer-events: none;
  }

  .segmented {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .btn-reset {
    margin-top: auto;
    padding: 12px 0;
    border: none;
    border-top: 1px solid var(--border);
    background: transparent;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-secondary);
    cursor: pointer;
    transition: color 0.2s;
    font-family: inherit;
  }

  .btn-reset:hover { color: var(--text); }

  /* —— Main Column —— */
  .main {
    margin-left: var(--rail-width);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* —— Hero：右侧 AI 神经网络球体配图（请打开 index.html，勿直接预览 template） —— */
  .hero {
    position: relative;
    min-height: 78vh;
    display: flex;
    align-items: flex-end;
    justify-content: flex-start;
    background-color: var(--bg);
    padding: 88px 56px 72px calc(var(--rail-width) + 48px);
    text-align: left;
    overflow: hidden;
  }

  .hero__bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 72% 45%;
    z-index: 0;
    pointer-events: none;
  }

  .hero__shade {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: linear-gradient(
      90deg,
      var(--bg) 0%,
      var(--bg) 10%,
      rgba(247, 245, 240, 0.9) 28%,
      rgba(247, 245, 240, 0.45) 42%,
      rgba(247, 245, 240, 0.08) 54%,
      transparent 64%
    );
  }

  .hero__inner {
    position: relative;
    z-index: 2;
    max-width: 640px;
    width: 100%;
  }

  .hero__eyebrow {
    margin: 0 0 12px;
    font-family: var(--font);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .hero__title {
    margin: 0 0 8px;
    font-family: var(--font);
    font-size: var(--hero-title-size);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.05;
    color: var(--text);
  }

  .hero__subtitle {
    margin: 0 0 20px;
    font-family: var(--font);
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: var(--text-secondary);
  }

  .hero__meta {
    margin: 0 0 36px;
    font-size: 13px;
    font-weight: 400;
    color: var(--text-muted);
    letter-spacing: 0.02em;
    line-height: 1.6;
  }

  .hero-search-wrap {
    position: relative;
    max-width: 480px;
    width: 100%;
  }

  .hero-search {
    width: 100%;
    padding: 16px 20px;
    border: none;
    border-bottom: 1px solid var(--text);
    background: transparent;
    font-size: 15px;
    font-weight: 400;
    color: var(--text);
    outline: none;
    font-family: var(--font);
    transition: border-color 0.25s ease;
  }

  .hero-search::placeholder { color: transparent; }

  .hero-search:focus {
    border-bottom-width: 2px;
  }

  .hero-search-ghost {
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    font-size: 15px;
    font-weight: 400;
    color: var(--text-muted);
    pointer-events: none;
    white-space: nowrap;
    transition: opacity 0.2s;
  }

  .hero-search-wrap.is-typing .hero-search-ghost::after {
    content: "|";
    margin-left: 2px;
    animation: caret-blink 1s step-end infinite;
  }

  .hero-search-wrap.has-value .hero-search-ghost,
  .hero-search:focus + .hero-search-ghost {
    opacity: 0;
  }

  @keyframes caret-blink {
    50% { opacity: 0; }
  }

  /* —— Content —— */
  #content-area {
    flex: 1;
    padding: 48px 56px 80px;
    scroll-margin-top: 24px;
  }

  .day-section {
    margin-bottom: 64px;
    scroll-margin-top: 24px;
  }

  .day-section:last-child { margin-bottom: 0; }

  .day-section__header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    margin-bottom: 32px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .day-section__header h2 {
    margin: 0;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--text);
  }

  .day-section__count {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }

  .cards-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 32px;
    align-items: start;
  }

  @media (min-width: 768px) {
    .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  @media (min-width: 1100px) {
    .cards-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

  /* —— Story Cards —— */
  .story-card {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: var(--card-height);
    min-height: var(--card-height);
    max-height: var(--card-height);
    overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    scroll-margin-top: 20px;
    transition: transform 0.32s cubic-bezier(0.25, 0.1, 0.25, 1),
                box-shadow 0.32s ease,
                min-height 0.3s ease;
  }

  .story-card:hover {
    transform: translateY(-8px);
    box-shadow: var(--shadow-card);
  }

  /* 展开：卡片随内容变长；折叠：恢复固定高度 */
  .story-card--expanded {
    z-index: 2;
    height: auto;
    max-height: none;
    min-height: var(--card-height);
    overflow: visible;
    box-shadow: var(--shadow-card);
  }

  .story-card--expanded .story-card__body {
    flex: 0 1 auto;
    min-height: 0;
    overflow: visible;
  }

  .story-card--expanded .story-card__excerpt-wrap {
    flex: 0 1 auto;
    overflow: visible;
  }

  .story-card--expanded .story-card__tags {
    margin-top: 14px;
    max-height: none;
    overflow: visible;
  }

  .story-card--focus {
    animation: card-focus 1.2s ease;
  }

  @keyframes card-focus {
    0%, 100% { box-shadow: none; }
    40% { box-shadow: 0 0 0 1px var(--text), var(--shadow-card); }
  }

  .story-card__media {
    position: relative;
    flex: 0 0 var(--card-media-height);
    width: 100%;
    height: var(--card-media-height);
    overflow: hidden;
    background: linear-gradient(145deg, #ebe8e1 0%, #ddd9d0 50%, #d4cfc4 100%);
  }

  .story-card__media img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  .story-card__media img.story-card__media-img--fallback {
    opacity: 0;
  }

  .story-card:hover .story-card__media img {
    transform: scale(1.04);
  }

  .story-card__body {
    flex: 1 1 auto;
    min-height: var(--card-body-min);
    padding: 24px 26px 26px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    font-family: var(--font);
    font-size: var(--card-body-size);
    font-weight: 400;
  }

  .story-card__date {
    font-family: var(--font);
    font-size: var(--card-meta-size);
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 14px;
  }

  .story-card__title,
  .story-card h3.story-card__title {
    margin: 0 0 12px;
    padding: 0;
    flex: 0 0 auto;
    min-height: calc(var(--card-title-size) * 1.3 * 2);
    max-height: calc(var(--card-title-size) * 1.3 * 2);
    font-family: var(--font);
    font-size: var(--card-title-size);
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: 0;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .story-card__title a,
  .story-card h3.story-card__title a {
    display: block;
    font-family: inherit;
    font-size: var(--card-title-size);
    font-weight: 700;
    line-height: 1.3;
    color: inherit;
    text-decoration: none;
    transition: opacity 0.2s;
  }

  .story-card__title a:hover { opacity: 0.65; }

  .story-card__excerpt-wrap {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }

  .story-card__excerpt,
  .story-card__excerpt-wrap p.story-card__excerpt {
    margin: 0;
    font-family: var(--font);
    font-size: var(--card-body-size);
    font-weight: 400;
    line-height: 1.65;
    color: var(--text);
  }

  .story-card__excerpt.is-clamped {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .excerpt-toggle {
    align-self: flex-start;
    padding: 0;
    border: none;
    background: none;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    cursor: pointer;
    font-family: inherit;
    transition: color 0.2s;
  }

  .excerpt-toggle:hover { color: var(--text); }

  .excerpt-toggle[hidden] { display: none; }

  .story-card--expanded .excerpt-toggle {
    display: inline-block;
    flex: 0 0 auto;
  }

  .story-card__tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    flex: 0 0 auto;
    margin-top: auto;
    padding-top: 14px;
    max-height: 56px;
    overflow: hidden;
    border-top: 1px solid var(--border);
  }

  .tag {
    font-family: var(--font);
    font-size: var(--card-meta-size);
    font-weight: 400;
    letter-spacing: 0.02em;
    color: var(--text-secondary);
    background: rgba(26, 26, 26, 0.05);
    padding: 4px 8px;
  }

  .story-card__cta {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    flex: 0 0 auto;
    margin-top: 12px;
    font-family: var(--font);
    font-size: var(--card-cta-size);
    font-weight: 400;
    line-height: 1.65;
    letter-spacing: 0;
    text-transform: none;
    color: var(--text-secondary);
    text-decoration: none;
    transition: gap 0.25s ease, opacity 0.2s;
  }

  .story-card__cta:hover {
    gap: 8px;
    opacity: 0.7;
  }

  .story-card__cta::after {
    content: "\2192";
    font-size: var(--card-cta-size);
    line-height: 1;
  }

  .empty {
    text-align: center;
    padding: 100px 24px;
    color: var(--text-muted);
    font-size: 14px;
    letter-spacing: 0.02em;
  }

  .site-footer {
    padding: 28px 48px 40px;
    border-top: 1px solid var(--border);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    text-align: center;
    background: var(--bg);
  }

  @media (max-width: 767px) {
    .hero {
      padding: 72px 24px 56px calc(var(--rail-width) + 20px);
      min-height: 70vh;
    }
    #content-area { padding: 32px 24px 56px; }
    .site-footer { padding: 24px; }
  }
</style>
</head>
<body>

<nav class="icon-rail" aria-label="工具栏">
  <button type="button" class="rail-btn" id="btn-search" aria-label="搜索" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/>
      <line x1="16.5" y1="16.5" x2="21" y2="21"/>
    </svg>
  </button>
  <button type="button" class="rail-btn" id="btn-filter" aria-label="筛选" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <line x1="4" y1="7" x2="20" y2="7"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="17" x2="20" y2="17"/>
    </svg>
  </button>
</nav>

<div id="overlay" aria-hidden="true"></div>

<aside id="panel-search" class="slide-panel" aria-label="搜索面板" aria-hidden="true">
  <div class="panel-header">
    <h2>搜索</h2>
    <button type="button" class="panel-close" data-close-panel aria-label="关闭搜索">
      <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </div>
  <div class="panel-body">
    <input type="search" id="search-input-side" class="search-field"
      placeholder="热点搜索..." autocomplete="off">
  </div>
</aside>

<aside id="panel-filter" class="slide-panel" aria-label="筛选面板" aria-hidden="true">
  <div class="panel-header">
    <h2>筛选</h2>
    <button type="button" class="panel-close" data-close-panel aria-label="关闭筛选">
      <svg viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
    </button>
  </div>
  <div class="panel-body">
    <div class="filter-section">
      <span class="filter-section__label">日期</span>
      <div class="chip-group" id="date-filters"></div>
    </div>

    <div class="filter-section">
      <span class="filter-section__label">来源</span>
      <div class="segmented" id="region-filters">
        <button type="button" class="chip active" data-reg="all" onclick="toggleRegion('all')">全部</button>
        <button type="button" class="chip" data-reg="domestic" onclick="toggleRegion('domestic')">国内</button>
        <button type="button" class="chip" data-reg="overseas" onclick="toggleRegion('overseas')">海外</button>
      </div>
    </div>

    <div class="filter-section">
      <span class="filter-section__label">工具</span>
      <div class="chip-group" id="tool-filters"></div>
    </div>

    <div class="filter-section">
      <span class="filter-section__label">技术点</span>
      <div class="chip-group" id="tech-cloud"></div>
    </div>

    <button type="button" class="btn-reset" onclick="resetFilters()">重置筛选</button>
  </div>
</aside>

<script>
const ALL_TOOL_FILTERS = ["OpenAI", "Codex", "Claude", "Gemini", "DeepSeek", "Kimi", "Qwen", "通义", "文心", "豆包", "Cursor", "Copilot", "MCP", "Agent", "太空算力", "行业动态"];

const payload = JSON.parse(document.getElementById('dashboard-data').textContent);
const allItems = payload.items || [];
const meta = payload.meta || {};

let activeDate = 'all';
let activeRegion = 'all';
let activeTool = 'all';
let activeTags = new Set();
let searchQuery = '';
let isFirstRender = true;
let scrollTimer = null;
let lastSearchValue = '';
let openPanelId = null;

const panelSearch = document.getElementById('panel-search');
const panelFilter = document.getElementById('panel-filter');
const overlay = document.getElementById('overlay');
const btnSearch = document.getElementById('btn-search');
const btnFilter = document.getElementById('btn-filter');
const searchInput = document.getElementById('search-input');
const searchInputSide = document.getElementById('search-input-side');

function openSearchPanel() {
  closePanels();
  openPanelId = 'search';
  panelSearch.classList.add('is-open');
  panelSearch.setAttribute('aria-hidden', 'false');
  btnSearch.classList.add('is-active');
  btnSearch.setAttribute('aria-expanded', 'true');
  overlay.classList.add('is-visible');
  overlay.setAttribute('aria-hidden', 'false');
  searchInputSide.value = searchInput.value;
  setTimeout(() => searchInputSide.focus(), 320);
}

function openFilterPanel() {
  closePanels();
  openPanelId = 'filter';
  panelFilter.classList.add('is-open');
  panelFilter.setAttribute('aria-hidden', 'false');
  btnFilter.classList.add('is-active');
  btnFilter.setAttribute('aria-expanded', 'true');
  overlay.classList.add('is-visible');
  overlay.setAttribute('aria-hidden', 'false');
}

function closePanels() {
  openPanelId = null;
  panelSearch.classList.remove('is-open');
  panelFilter.classList.remove('is-open');
  panelSearch.setAttribute('aria-hidden', 'true');
  panelFilter.setAttribute('aria-hidden', 'true');
  btnSearch.classList.remove('is-active');
  btnFilter.classList.remove('is-active');
  btnSearch.setAttribute('aria-expanded', 'false');
  btnFilter.setAttribute('aria-expanded', 'false');
  overlay.classList.remove('is-visible');
  overlay.setAttribute('aria-hidden', 'true');
}

btnSearch.addEventListener('click', () => {
  if (openPanelId === 'search') closePanels();
  else openSearchPanel();
});

btnFilter.addEventListener('click', () => {
  if (openPanelId === 'filter') closePanels();
  else openFilterPanel();
});

overlay.addEventListener('click', closePanels);
document.querySelectorAll('[data-close-panel]').forEach(btn => {
  btn.addEventListener('click', closePanels);
});

function syncSearchFromHero() {
  searchInputSide.value = searchInput.value;
  lastSearchValue = searchInput.value;
  applyFilters({ scroll: false });
}

function syncSearchFromSide() {
  searchInput.value = searchInputSide.value;
  lastSearchValue = searchInputSide.value;
  applyFilters({ scroll: false });
}

searchInputSide.addEventListener('input', syncSearchFromSide);
searchInputSide.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    searchInput.value = searchInputSide.value;
    searchQuery = searchInput.value;
    applyFilters({ scroll: true });
    closePanels();
  }
});

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatCardDate(dateStr) {
  if (!dateStr) return '';
  const months = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN',
                  'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const parts = dateStr.split('-');
  if (parts.length < 3) return dateStr;
  const y = parts[0];
  const m = parseInt(parts[1], 10);
  const d = parseInt(parts[2], 10);
  if (!m || !d) return dateStr;
  return `${months[m - 1]} ${d}, ${y}`;
}

function cardExcerpt(item) {
  let text = item.short_summary || item.summary || '';
  text = text.replace(/^在近\d+天[^，]*，/, '');
  text = text.replace(/Insight[：:].*$/s, '');
  return text.trim();
}

function normalizeImageUrl(url) {
  if (!url) return '';
  return String(url).replace(/&amp;/g, '&').trim();
}

function buildSearchPhrases() {
  const seen = new Set();
  const phrases = [];
  allItems.forEach(i => {
    let t = (i.short_title || i.title || '').replace(/…/g, '').trim();
    if (t.length > 32) t = t.slice(0, 32) + '…';
    if (t.length >= 4 && !seen.has(t)) {
      seen.add(t);
      phrases.push(t);
    }
  });
  if (phrases.length < 4) {
    ['OpenAI Codex', 'Claude API', 'Gemini', 'DeepSeek', 'Cursor Agent', 'MCP'].forEach(p => {
      if (!seen.has(p)) phrases.push(p);
    });
  }
  return phrases.slice(0, 12);
}

let searchAnimPhrases = [];
let searchAnimPhraseIdx = 0;
let searchAnimCharIdx = 0;
let searchAnimDeleting = false;
let searchAnimPaused = false;
let searchAnimTimer = null;

const SEARCH_PREFIX = '热点搜索 · ';

function updateSearchWrapState() {
  const wrap = document.getElementById('hero-search-wrap');
  const input = document.getElementById('search-input');
  if (!wrap || !input) return;
  const hasVal = !!input.value.trim();
  wrap.classList.toggle('has-value', hasVal);
  wrap.classList.toggle('is-typing', !hasVal && !searchAnimPaused);
}

function setSearchGhost(text) {
  const ghost = document.getElementById('search-ghost');
  if (ghost) ghost.textContent = text;
}

function tickSearchAnimation() {
  const input = document.getElementById('search-input');
  if (!input || input.value.trim() || searchAnimPaused) {
    updateSearchWrapState();
    return;
  }
  if (!searchAnimPhrases.length) searchAnimPhrases = buildSearchPhrases();
  const phrase = searchAnimPhrases[searchAnimPhraseIdx % searchAnimPhrases.length];
  const full = SEARCH_PREFIX + phrase;

  if (!searchAnimDeleting) {
    searchAnimCharIdx += 1;
    setSearchGhost(full.slice(0, searchAnimCharIdx));
    if (searchAnimCharIdx >= full.length) {
      searchAnimTimer = setTimeout(() => { searchAnimDeleting = true; tickSearchAnimation(); }, 2200);
      return;
    }
    searchAnimTimer = setTimeout(tickSearchAnimation, 55);
  } else {
    searchAnimCharIdx -= 1;
    setSearchGhost(full.slice(0, Math.max(searchAnimCharIdx, SEARCH_PREFIX.length)));
    if (searchAnimCharIdx <= SEARCH_PREFIX.length) {
      searchAnimDeleting = false;
      searchAnimCharIdx = SEARCH_PREFIX.length;
      searchAnimPhraseIdx = (searchAnimPhraseIdx + 1) % searchAnimPhrases.length;
      searchAnimTimer = setTimeout(tickSearchAnimation, 400);
      return;
    }
    searchAnimTimer = setTimeout(tickSearchAnimation, 28);
  }
  updateSearchWrapState();
}

function startSearchAnimation() {
  clearTimeout(searchAnimTimer);
  searchAnimPhrases = buildSearchPhrases();
  searchAnimPhraseIdx = 0;
  searchAnimCharIdx = SEARCH_PREFIX.length;
  searchAnimDeleting = false;
  setSearchGhost(SEARCH_PREFIX);
  searchAnimTimer = setTimeout(tickSearchAnimation, 600);
  updateSearchWrapState();
}

function onSearchFocus() {
  searchAnimPaused = true;
  clearTimeout(searchAnimTimer);
  setSearchGhost('');
  updateSearchWrapState();
}

function onSearchBlur() {
  searchAnimPaused = false;
  const input = document.getElementById('search-input');
  if (input && !input.value.trim()) startSearchAnimation();
  else updateSearchWrapState();
}

function normalizeTagLabel(tag) {
  if (!tag) return '';
  return tag === 'AI Agent' ? 'Agent' : tag;
}

function itemMatchesTool(item, tool) {
  if (tool === 'all') return true;
  const want = normalizeTagLabel(tool);
  return [item.tool, ...(item.tools || [])]
    .some(t => normalizeTagLabel(t) === want);
}

function buildCardTags(item) {
  const tool = normalizeTagLabel(item.tool || (item.tools && item.tools[0]) || '');
  const regionLabel = item.is_domestic ? '国内' : '海外';
  const raw = item.tech_points || item.tags || [];
  const tags = [];
  if (tool) tags.push(tool);
  raw.forEach(t => {
    const label = normalizeTagLabel(t);
    if (!label || label === tool || tags.includes(label)) return;
    tags.push(label);
  });
  tags.push(regionLabel);
  return tags;
}

function mkChip(label, value, active, onClick, disabled = false) {
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'chip' + (active ? ' active' : '') + (disabled ? ' disabled' : '');
  btn.textContent = label;
  if (!disabled) btn.onclick = onClick;
  return btn;
}

function renderDateFilters() {
  const el = document.getElementById('date-filters');
  el.innerHTML = '';
  el.appendChild(mkChip('全部', 'all', activeDate === 'all', () => {
    activeDate = 'all'; renderDateFilters(); applyFilters({ scroll: true });
  }));
  [...new Set(allItems.map(i => i.date))].sort().reverse().forEach(d => {
    const n = allItems.filter(i => i.date === d).length;
    el.appendChild(mkChip(`${d} · ${n}`, d, activeDate === d, () => {
      activeDate = d; renderDateFilters(); applyFilters({ scroll: true });
    }));
  });
}

function renderToolFilters() {
  const el = document.getElementById('tool-filters');
  el.innerHTML = '';
  el.appendChild(mkChip(`全部 · ${allItems.length}`, 'all', activeTool === 'all', () => {
    activeTool = 'all'; renderToolFilters(); applyFilters({ scroll: true });
  }));
  ALL_TOOL_FILTERS.forEach(t => {
    const n = allItems.filter(i => itemMatchesTool(i, t)).length;
    el.appendChild(mkChip(`${t} · ${n}`, t, activeTool === t, () => {
      activeTool = t; renderToolFilters(); applyFilters({ scroll: true });
    }, n === 0));
  });
}

function renderTechCloud() {
  const counts = {};
  allItems.forEach(i => (i.tech_points || []).forEach(t => counts[t] = (counts[t] || 0) + 1));
  const el = document.getElementById('tech-cloud');
  el.innerHTML = '';
  Object.entries(counts).sort((a, b) => b[1] - a[1]).forEach(([tag, n]) => {
    el.appendChild(mkChip(`${tag} · ${n}`, tag, activeTags.has(tag), () => {
      if (activeTags.has(tag)) activeTags.delete(tag);
      else activeTags.add(tag);
      renderTechCloud(); applyFilters({ scroll: true });
    }));
  });
}

function getFiltered() {
  const q = searchQuery.trim().toLowerCase();
  return allItems.filter(i => {
    if (activeDate !== 'all' && i.date !== activeDate) return false;
    if (!itemMatchesTool(i, activeTool)) return false;
    if (activeRegion !== 'all') {
      if ((i.is_domestic ? 'domestic' : 'overseas') !== activeRegion) return false;
    }
    if (activeTags.size && !(i.tech_points || []).some(t => activeTags.has(t))) return false;
    if (q) {
      const hay = `${i.title} ${i.short_summary} ${(i.tech_points || []).join(' ')}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function excerptNeedsToggle(excerpt) {
  excerpt.classList.remove('is-clamped');
  const fullHeight = excerpt.scrollHeight;
  excerpt.classList.add('is-clamped');
  return fullHeight > excerpt.clientHeight + 2;
}

function bindExcerptToggles(root) {
  root.querySelectorAll('.story-card__excerpt-wrap').forEach(wrap => {
    const excerpt = wrap.querySelector('.story-card__excerpt');
    const toggle = wrap.querySelector('.excerpt-toggle');
    if (!excerpt || !toggle) return;

    excerpt.classList.add('is-clamped');
    toggle.hidden = true;
    toggle.textContent = '展开';

    requestAnimationFrame(() => {
      if (excerptNeedsToggle(excerpt)) {
        toggle.hidden = false;
      }
    });

    toggle.onclick = () => {
      const card = wrap.closest('.story-card');
      const clamped = excerpt.classList.contains('is-clamped');
      if (clamped) {
        excerpt.classList.remove('is-clamped');
        if (card) card.classList.add('story-card--expanded');
        toggle.textContent = '收起';
        toggle.setAttribute('aria-expanded', 'true');
      } else {
        excerpt.classList.add('is-clamped');
        if (card) card.classList.remove('story-card--expanded');
        toggle.textContent = '展开';
        toggle.setAttribute('aria-expanded', 'false');
      }
    };
  });
}

function createStoryCardElement(item) {
  const art = document.createElement('article');
  art.className = 'story-card';
  art.dataset.id = item.id || '';

  const title = item.short_title || item.title || '';
  const excerpt = cardExcerpt(item);
  const tags = buildCardTags(item);

  const imgUrl = normalizeImageUrl(item.image_url);
  const mediaInner = imgUrl
    ? `<img src="${escapeHtml(imgUrl)}" alt="" loading="lazy"
        onerror="this.onerror=null;this.classList.add('story-card__media-img--fallback')">`
    : '';
  const mediaHtml = `<div class="story-card__media">${mediaInner}</div>`;

  art.innerHTML = `
    ${mediaHtml}
    <div class="story-card__body">
      <time class="story-card__date">${escapeHtml(formatCardDate(item.date))}</time>
      <h3 class="story-card__title">
        <a href="${escapeHtml(item.url)}" target="_blank" rel="noopener">${escapeHtml(title)}</a>
      </h3>
      <div class="story-card__excerpt-wrap">
        <p class="story-card__excerpt is-clamped">${escapeHtml(excerpt)}</p>
        <button type="button" class="excerpt-toggle" hidden aria-expanded="false">展开</button>
      </div>
      <div class="story-card__tags">
        ${tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}
      </div>
      <a class="story-card__cta" href="${escapeHtml(item.url)}" target="_blank" rel="noopener">阅读全文</a>
    </div>
  `;
  return art;
}

function renderContent() {
  const root = document.getElementById('content-area');
  root.innerHTML = '';
  const filtered = getFiltered();

  if (!filtered.length) {
    root.innerHTML = '<div class="empty">没有匹配的热点，试试调整筛选条件</div>';
    return;
  }

  const groups = {};
  filtered.forEach(i => { (groups[i.date] ||= []).push(i); });

  Object.keys(groups).sort().reverse().forEach(date => {
    const section = document.createElement('section');
    section.className = 'day-section';
    section.innerHTML = `
      <div class="day-section__header">
        <h2>${escapeHtml(date)}</h2>
        <span class="day-section__count">${groups[date].length} 条</span>
      </div>
      <div class="cards-grid"></div>
    `;
    const grid = section.querySelector('.cards-grid');
    const dayItems = groups[date];
    dayItems.forEach(item => grid.appendChild(createStoryCardElement(item)));

    root.appendChild(section);
  });

  bindExcerptToggles(root);
}

function scrollToFilteredResults() {
  const root = document.getElementById('content-area');
  if (!root) return;
  const firstCard = root.querySelector('.story-card');
  const target = firstCard || root.querySelector('.empty') || root;
  requestAnimationFrame(() => {
    target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    root.querySelectorAll('.story-card--focus').forEach(el => el.classList.remove('story-card--focus'));
    if (firstCard) {
      firstCard.classList.add('story-card--focus');
      window.setTimeout(() => firstCard.classList.remove('story-card--focus'), 1200);
    }
  });
}

function applyFilters(opts = {}) {
  const shouldScroll = opts.scroll === true && !isFirstRender;
  searchQuery = document.getElementById('search-input').value;
  renderContent();
  if (!shouldScroll) return;
  clearTimeout(scrollTimer);
  scrollTimer = setTimeout(scrollToFilteredResults, 0);
}

function onSearchInput() {
  const input = document.getElementById('search-input');
  lastSearchValue = input.value;
  searchInputSide.value = input.value;
  if (input.value.trim()) {
    clearTimeout(searchAnimTimer);
    setSearchGhost('');
  } else if (!searchAnimPaused) {
    startSearchAnimation();
  }
  updateSearchWrapState();
  applyFilters({ scroll: false });
}

function onSearchKeydown(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    searchQuery = document.getElementById('search-input').value;
    searchInputSide.value = searchQuery;
    applyFilters({ scroll: true });
  }
}

function toggleRegion(reg) {
  activeRegion = reg;
  document.querySelectorAll('#region-filters .chip').forEach(b => {
    b.classList.toggle('active', b.dataset.reg === reg);
  });
  applyFilters({ scroll: true });
}

function resetFilters() {
  activeDate = 'all';
  activeRegion = 'all';
  activeTool = 'all';
  activeTags.clear();
  searchQuery = '';
  const input = document.getElementById('search-input');
  input.value = '';
  searchInputSide.value = '';
  lastSearchValue = '';
  toggleRegion('all');
  renderDateFilters();
  renderToolFilters();
  renderTechCloud();
  applyFilters({ scroll: false });
  startSearchAnimation();
}

function init() {
  renderDateFilters();
  renderToolFilters();
  renderTechCloud();
  isFirstRender = true;
  renderContent();
  isFirstRender = false;
  lastSearchValue = document.getElementById('search-input').value;
  startSearchAnimation();
}

init();
</script>
